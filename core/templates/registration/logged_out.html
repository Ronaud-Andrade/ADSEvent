{% extends "eventos/base.html" %}
{% block title %}Logout{% endblock %}

{% block content %}
<!-- ===== Mensagem de confirmação de logout ===== -->
<div style="max-width: 400px; margin: 100px auto; text-align: center;">
    <h2>Você saiu da sua conta.</h2>
    <p>Esperamos te ver de novo em breve 💕</p>

    <!-- Link para voltar ao login -->
    <a href="{% url 'login' %}" style="display:inline-block; margin-top:20px; padding:10px 20px; background:#FF5722; color:white; border-radius:5px; text-decoration:none;">
        Voltar ao Login
    </a>
</div>
{% endblock %}
