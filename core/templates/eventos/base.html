{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Sistema de Eventos{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header>
    <h1>Sistema de Eventos</h1>
    <nav>
      <a href="{% url 'event_list' %}">Eventos</a> |
      <a href="{% url 'category_list' %}">Categorias</a> |
      <a href="{% url 'subscribe_list' %}">Minhas Inscrições</a> |
      {% if user.is_authenticated %}
        <!-- Logout via POST para segurança -->
        <form action="{% url 'logout' %}" method="post" style="display:inline;">
          {% csrf_token %}
          <button type="submit" style="background:none; border:none; color:#007bff; cursor:pointer; text-decoration:underline;">Sair</button>
        </form>
      {% else %}
        <a href="{% url 'login' %}">Entrar</a>
      {% endif %}
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer>
    <p>© {{ now|date:"Y" }} - Sistema de Eventos</p>
  </footer>
</body>
</html>
