<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema de Eventos{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- ===== Estilos básicos (fáceis de trocar depois) ===== -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            color: #333;
        }

        header {
            background-color: #333;
            color: white;
            padding: 15px 20px;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav .links a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
        }

        nav .links a:hover {
            text-decoration: underline;
        }

        nav .user-area {
            display: flex;
            align-items: center;
        }

        nav form {
            display: inline;
            margin: 0;
        }

        nav button {
            background: none;
            border: none;
            color: #ffb3b3;
            cursor: pointer;
            font-size: 1em;
            text-decoration: underline;
        }

        main {
            padding: 20px;
        }

        footer {
            text-align: center;
            padding: 10px;
            font-size: 0.9em;
            color: #666;
            border-top: 1px solid #ddd;
            margin-top: 30px;
        }
    </style>
</head>

<body>

<header>
    <nav>
        <!-- ===== Links principais do sistema ===== -->
        <div class="links">
            {% if user.is_authenticated %}
                <a href="{% url 'event_list' %}">Eventos</a>
                <a href="{% url 'category_list' %}">Categorias</a>
                <a href="{% url 'subscribe_list' %}">Inscrições</a>
            {% endif %}
        </div>

        <!-- ===== Área do usuário ===== -->
        <div class="user-area">
            {% if user.is_authenticated %}
                <!-- Mostra o nome do usuário logado -->
                <span>Olá, {{ user.username }}!</span>

                <!-- Formulário POST para logout (seguro) -->
                <form action="{% url 'logout' %}" method="post" style="margin-left:10px;">
                    {% csrf_token %}
                    <button type="submit">Sair</button>
                </form>

            {% else %}
                <!-- Mostra os links de login e cadastro quando o usuário não está logado -->
                <a href="{% url 'login' %}">Entrar</a>
                <a href="{% url 'signup' %}">Cadastrar</a>
            {% endif %}
        </div>
    </nav>
</header>

<!-- ===== Conteúdo principal (muda em cada página) ===== -->
<main>
    {% block content %}{% endblock %}
</main>

<!-- ===== Rodapé simples ===== -->
<footer>
    <small>Sistema de Eventos - Feito com 💕 e Django</small>
</footer>

</body>
</html>
