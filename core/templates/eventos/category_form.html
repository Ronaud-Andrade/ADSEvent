{% extends "eventos/base.html" %}
{% block content %}
<div class="form-card">
  <h2 class="form-title">{% if object %}Editar{% else %}Nova{% endif %} Categoria</h2>

  <form method="post" class="form-container">
    {% csrf_token %}
    {{ form.as_p }}

    <div class="confirm-btn-container">
      <button type="submit" class="save-btn">Salvar</button>
      <a href="{% url 'category_list' %}" class="back-btn">Voltar</a>
    </div>
  </form>
</div>
{% endblock %}
