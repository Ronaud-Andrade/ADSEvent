{% extends "eventos/base.html" %}
{% block title %}Categorias{% endblock %}
{% block content %}
<h2 style="text-align:center; margin-bottom:20px;">Lista de Categorias</h2>

<!-- Botão Nova Categoria com mesma classe de estilo do Novo Evento -->
<div class="main-button-container">
  <a href="{% url 'category_create' %}" class="button main-button">Nova Categoria</a>
</div>

<table class="table-striped">
  <thead>
    <tr>
      <th>Nome</th>
      <th>Ações</th>
    </tr>
  </thead>
  <tbody>
    {% for category in categories %}
    <tr>
      <td>{{ category.name }}</td>
      <td>
        <a href="{% url 'category_edit' category.pk %}" class="edit-btn">Editar</a> |
        <a href="{% url 'category_delete' category.pk %}" class="delete-btn">Excluir</a>
      </td>
    </tr>
    {% empty %}
    <tr>
      <td colspan="2" style="text-align:center;">Nenhuma categoria cadastrada.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
